version: "3.9"

# ─────────────────────────────────────────────────────────────
# Eve Diagnostic Booking Platform — docker-compose
#
# Services:
#   postgres  — local PostgreSQL (dev/test only)
#   api       — Express backend
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up --build api      # start only the API (uses external DB)
#   docker compose down -v             # stop and wipe volumes
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-eve_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eve} -d ${POSTGRES_DB:-eve_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: eve_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:               production
      PORT:                   3000
      DATABASE_URL:           postgresql://${POSTGRES_USER:-eve}:${POSTGRES_PASSWORD:-eve_secret}@postgres:5432/${POSTGRES_DB:-eve_db}?schema=public
      JWT_ACCESS_SECRET:      ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN:  ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS:        ${ALLOWED_ORIGINS:-http://localhost:5173}
      BCRYPT_ROUNDS:          ${BCRYPT_ROUNDS:-12}
      LOG_LEVEL:              ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
